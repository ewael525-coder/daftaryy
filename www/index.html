<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1E4D40">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Daftary">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>دفتري</title>
<style>
  :root{
    --bg:#F6F3EE;
    --surface:#FFFFFF;
    --ink:#070b0a;
    --ink-soft:#070b0a;
    --primary:#070b0a;
    --primary-soft:#E4ECE7;
    --amber:#B8763A;
    --amber-soft:#F3E4D3;
    --danger:#A8432E;
    --danger-soft:#F5E0DA;
    --line:#E7E1D6;
    --radius:18px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Tahoma,Arial,sans-serif;
    background:var(--bg);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  #phone{
    max-width:430px;
    margin:0 auto;
    min-height:100vh;
    background:var(--bg);
    position:relative;
    display:flex;
    flex-direction:column;
  }
  header.topbar{
    padding:22px 20px 14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .brandline{display:flex;flex-direction:column;gap:2px;}
  .brandline .label{font-size:12px;color:var(--ink-soft);}
  .brandline .name{font-size:22px;font-weight:900;letter-spacing:-.3px;}
  .icon-btn{
    width:38px;height:38px;border-radius:50%;
    background:var(--surface);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;color:var(--ink);
  }
  main{
    flex:1;
    padding:4px 18px 100px;
    overflow-y:auto;
  }
  .hidden{display:none !important;}

  /* dashboard */
  .hero{
    background:linear-gradient(135deg,var(--primary) 0%,#070b0a 100%);
    border-radius:24px;
    padding:26px 22px;
    color:#F5F1E8;
    margin-bottom:16px;
    position:relative;
    overflow:hidden;
  }
  .hero .eyebrow{font-size:13px;opacity:.75;margin-bottom:6px;}
  .hero .amount{font-size:38px;font-weight:900;line-height:1.1;}
  .hero .amount span{font-size:18px;font-weight:700;opacity:.8;}
  .stat-grid{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:10px;
    margin-bottom:18px;
  }
  .stat-card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:16px;
    padding:14px 10px;
    text-align:center;
  }
  .stat-card .num{font-size:22px;font-weight:900;color:var(--primary);}
  .stat-card .lbl{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}

  .section-title{
    display:flex;align-items:center;justify-content:space-between;
    margin:18px 0 10px;
  }
  .section-title h2{font-size:16px;font-weight:700;margin:0;}
  .section-title .muted{font-size:12.5px;color:var(--ink-soft);}

  .today-card{
    background:var(--surface);border:1px solid var(--line);
    border-radius:16px;padding:14px 16px;
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:8px;
  }
  .today-card .t1{font-size:14px;font-weight:700;}
  .today-card .t2{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .today-card .price{font-size:16px;font-weight:900;color:var(--amber);}

  .empty{
    text-align:center;padding:30px 14px;color:var(--ink-soft);
    background:var(--surface);border:1px dashed var(--line);border-radius:16px;
    font-size:13.5px;
  }

  /* tabs bottom */
  nav.tabbar{
    position:fixed;bottom:0;left:50%;transform:translateX(-50%);
    width:100%;max-width:430px;
    background:var(--surface);
    border-top:1px solid var(--line);
    display:flex;
    padding:8px 6px calc(8px + env(safe-area-inset-bottom));
    z-index:40;
  }
  .tab-btn{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
    background:none;border:none;color:var(--ink-soft);font-family:inherit;
    font-size:11px;padding:6px 2px;border-radius:12px;cursor:pointer;
  }
  .tab-btn.active{color:var(--primary);font-weight:700;}
  .tab-btn svg{width:22px;height:22px;}

  /* generic list card */
  .card{
    background:var(--surface);border:1px solid var(--line);
    border-radius:16px;padding:14px 16px;margin-bottom:10px;
  }

  .cat-card{
    background:var(--surface);border:1px solid var(--line);
    border-radius:18px;padding:18px 16px;margin-bottom:10px;
    display:flex;align-items:center;justify-content:space-between;
    cursor:pointer;
  }
  .cat-card .cname{font-size:16px;font-weight:700;}
  .cat-card .csub{font-size:12px;color:var(--ink-soft);margin-top:3px;}
  .cat-card .chev{color:var(--ink-soft);}

  .type-block{margin-bottom:16px;}
  .type-block h3{
    font-size:13.5px;font-weight:700;color:var(--primary);
    margin:0 0 8px;display:flex;align-items:center;gap:6px;
  }
  .prod-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .prod-card{
    background:var(--surface);border:1px solid var(--line);border-radius:16px;
    overflow:hidden;
  }
  .prod-card .img{
    width:100%;aspect-ratio:1/1;background:var(--primary-soft);
    display:flex;align-items:center;justify-content:center;overflow:hidden;
  }
  .prod-card .img img{width:100%;height:100%;object-fit:cover;}
  .prod-card .body{padding:9px 10px 11px;}
  .prod-card .pname{font-size:13px;font-weight:700;margin-bottom:5px;}
  .prod-card .prices{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-soft);}
  .prod-card .prices b{color:var(--ink);font-size:12px;}

  .cust-row{
    background:var(--surface);border:1px solid var(--line);border-radius:16px;
    padding:13px 16px;margin-bottom:9px;display:flex;justify-content:space-between;align-items:center;
    cursor:pointer;
  }
  .cust-row .cn{font-size:14.5px;font-weight:700;}
  .cust-row .cp{font-size:12px;color:var(--ink-soft);margin-top:2px;direction:ltr;text-align:right;}
  .cust-row .debt{font-size:13px;font-weight:800;}
  .debt.owe{color:var(--danger);}
  .debt.clear{color:var(--primary);}

  .ship-row{
    background:var(--surface);border:1px solid var(--line);border-radius:16px;
    padding:13px 16px;margin-bottom:9px;cursor:pointer;
  }
  .ship-row .row1{display:flex;justify-content:space-between;align-items:center;}
  .ship-row .sp{font-size:15px;font-weight:800;}
  .ship-row .meta{font-size:11.5px;color:var(--ink-soft);margin-top:5px;display:flex;gap:10px;flex-wrap:wrap;}
  .badge{
    font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;
  }
  .badge.pending{background:var(--amber-soft);color:var(--amber);}
  .badge.confirmed{background:var(--primary-soft);color:var(--primary);}
  .badge.confiscated{background:var(--danger-soft);color:var(--danger);}
  .ship-row .profit-line{font-size:12px;margin-top:6px;font-weight:700;}

  .fab{
    position:fixed;bottom:88px;left:50%;
    transform:translateX(-50%) translateX(163px);
    width:54px;height:54px;border-radius:50%;
    background:var(--primary);color:#fff;border:none;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 8px 20px rgba(30,77,64,.35);
    cursor:pointer;z-index:41;
  }
  .fab svg{width:24px;height:24px;}

  /* modal / sheet */
  .overlay{
    position:fixed;inset:0;background:rgba(20,24,18,.45);
    display:flex;align-items:flex-end;justify-content:center;z-index:60;
  }
  .sheet{
    width:100%;max-width:430px;background:var(--bg);
    border-radius:24px 24px 0 0;padding:18px 20px 26px;
    max-height:88vh;overflow-y:auto;
  }
  .sheet h3{margin:2px 0 16px;font-size:17px;font-weight:900;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12.5px;color:var(--ink-soft);margin-bottom:5px;}
  .field input, .field select, .field textarea{
    width:100%;padding:11px 13px;border-radius:12px;border:1px solid var(--line);
    background:var(--surface);font-family:inherit;font-size:14px;color:var(--ink);
  }
  .field textarea{resize:vertical;min-height:60px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .imgpick{
    display:flex;align-items:center;gap:12px;margin-bottom:12px;
  }
  .imgpick .prev{
    width:64px;height:64px;border-radius:14px;background:var(--primary-soft);
    display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;
  }
  .imgpick .prev img{width:100%;height:100%;object-fit:cover;}
  .btn{
    display:block;width:100%;text-align:center;padding:13px;border-radius:14px;
    border:none;font-family:inherit;font-size:14.5px;font-weight:700;cursor:pointer;
  }
  .btn.primary{background:var(--primary);color:#fff;margin-top:6px;}
  .btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line);margin-top:8px;}
  .btn.danger{background:var(--danger-soft);color:var(--danger);margin-top:8px;}
  .btn-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;}
  .close-x{
    position:absolute;top:14px;left:14px;width:32px;height:32px;border-radius:50%;
    background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;
  }
  .pick-row{
    display:flex;align-items:center;gap:12px;
    background:var(--surface);border:1px solid var(--line);border-radius:14px;
    padding:10px 12px;margin-bottom:8px;
  }
  .pick-row .pimg{
    width:44px;height:44px;border-radius:10px;background:var(--primary-soft);
    display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;
  }
  .pick-row .pimg img{width:100%;height:100%;object-fit:cover;}
  .pick-row .pinfo{flex:1;min-width:0;}
  .pick-row .pinfo .pn{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .pick-row .pinfo .pw{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
  .qty-box{display:flex;align-items:center;gap:8px;flex-shrink:0;}
  .qty-box button{
    width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--bg);
    font-size:16px;font-weight:700;cursor:pointer;color:var(--primary);display:flex;align-items:center;justify-content:center;
  }
  .qty-box .qn{min-width:18px;text-align:center;font-weight:800;font-size:14px;}
  .picker-search{
    width:100%;padding:11px 13px;border-radius:12px;border:1px solid var(--line);
    background:var(--surface);font-family:inherit;font-size:14px;margin-bottom:12px;
  }
  .items-summary{
    background:var(--surface);border:1px solid var(--line);border-radius:14px;
    padding:12px 14px;margin-bottom:12px;
  }
  .items-summary .irow{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px;color:var(--ink-soft);}
  .items-summary .irow:last-child{margin-bottom:0;}
  .items-summary .irow b{color:var(--ink);font-size:14px;}
  .items-summary .irow.total b{color:var(--primary);font-size:15px;}
  .mini-item{
    display:flex;align-items:center;justify-content:space-between;
    padding:8px 0;border-bottom:1px solid var(--line);font-size:12.5px;
  }
  .mini-item:last-child{border-bottom:none;}
  .status-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}
  .status-actions button{
    flex:1;min-width:100px;padding:10px;border-radius:12px;border:1px solid var(--line);
    background:var(--surface);font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer;color:var(--ink);
  }
  .status-actions button.on{background:var(--primary);color:#fff;border-color:var(--primary);}
  .status-actions button.on.confiscated-on{background:var(--danger);border-color:var(--danger);}
  #bgLayer{
    position:fixed;inset:0;z-index:0;pointer-events:none;
    background-repeat:no-repeat;background-position:center center;
    background-size:cover;
    opacity:.42;
  }
  #bgLayer::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,18,14,.30),rgba(20,18,14,.50));}
  #phone{position:relative;z-index:1;background:transparent !important;}
  header.topbar, main, nav.tabbar{position:relative;z-index:1;}
  .hero-img{
    border-radius:24px;overflow:hidden;margin-bottom:16px;background:#fff;
    border:1px solid var(--line);box-shadow:0 10px 24px rgba(0,0,0,.08);
  }
  .hero-img img{width:100%;display:block;}
  .prod-card .stock{
    margin-top:6px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;display:inline-block;
  }
  .prod-card .stock.ok{background:var(--primary-soft);color:var(--primary);}
  .prod-card .stock.out{background:var(--danger-soft);color:var(--danger);}
  .mode-row{display:flex;gap:6px;width:100%;margin-top:8px;}
  .mode-row button{
    flex:1;padding:7px;border-radius:10px;border:1px solid var(--line);background:var(--bg);
    font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;color:var(--ink);
  }
  .mode-row button.on{background:var(--amber);color:#fff;border-color:var(--amber);}
  #toast{
    position:fixed;bottom:100px;left:50%;transform:translateX(-50%);
    background:#20261F;color:#fff;padding:10px 20px;border-radius:30px;font-size:13px;
    z-index:100;opacity:0;pointer-events:none;transition:opacity .25s;
  }
  #toast.show{opacity:1;}
</style>
</head>
<body>
<div id="bgLayer"></div>
<div id="phone">

  <header class="topbar">
    <div class="brandline">
      <div class="label">مرحبا بيك 👋</div>
      <div class="name" id="storeName">متجري</div>
    </div>
    <button class="icon-btn" onclick="openSettings()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.04 1.56V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 8.96 19.3a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.56-1.04H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.7 8.96a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1.04-1.56V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1.04 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9a1.7 1.7 0 0 0 1.56 1.04H21a2 2 0 1 1 0 4h-.09A1.7 1.7 0 0 0 19.4 15z"/></svg>
    </button>
  </header>

  <main id="mainArea"></main>

  <button class="fab hidden" id="fabBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg></button>

  <nav class="tabbar">
    <button class="tab-btn active" data-tab="home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/></svg>
      الرئيسية
    </button>
    <button class="tab-btn" data-tab="products">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 8 12 3 3 8v8l9 5 9-5V8Z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg>
      المنتجات
    </button>
    <button class="tab-btn" data-tab="profits">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 20h18"/><rect x="5" y="11" width="3.5" height="6" rx="1"/><rect x="10.2" y="7" width="3.5" height="10" rx="1"/><rect x="15.4" y="3.5" width="3.5" height="13.5" rx="1"/></svg>
      الأرباح
    </button>
    <button class="tab-btn" data-tab="customers">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3.2"/><path d="M2.5 19c1-3.5 3.5-5 6.5-5s5.5 1.5 6.5 5"/><circle cx="17" cy="8.5" r="2.4"/><path d="M16 14.2c2.4.3 4 1.7 4.8 4.6"/></svg>
      العملاء
    </button>
    <button class="tab-btn" data-tab="shipments">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="7" width="13" height="10" rx="1.5"/><path d="M15 10h3.5l3 3.5V17h-6.5z"/><circle cx="7" cy="19" r="1.6"/><circle cx="17.5" cy="19" r="1.6"/></svg>
      الشحنات
    </button>
  </nav>
</div>

<div id="toast"></div>
<div id="modalRoot"></div>

<script>
/* ---------------- state & storage ---------------- */
let DB = { meta:{name:'متجري'}, categories:[], products:[], customers:[], shipments:[] };

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),1800);
}
function todayStr(){ return new Date().toISOString().slice(0,10); }
function fmtDate(d){
  if(!d) return '-';
  const dt=new Date(d+'T00:00:00');
  return dt.toLocaleDateString('ar-EG',{day:'numeric',month:'short'});
}
function money(n){
  n = Number(n)||0;
  return n.toLocaleString('ar-EG',{maximumFractionDigits:0})+' ج.م';
}

  const dt=new Date(dateStr+'T00:00:00');
  dt.setDate(dt.getDate()+Number(days||0));
  return dt.toISOString().slice(0,10);
}

/* Storage works two ways: inside Claude's artifact preview it uses the
   built-in window.storage API; opened as a standalone file/app on a phone
   (no window.storage available) it falls back to the browser's own
   localStorage, so the app keeps working and saving either way. */
async function storageGet(key){
  if(window.storage && typeof window.storage.get==='function'){
    try{ return await window.storage.get(key); }catch(e){ return null; }
  }
  try{
    const v = localStorage.getItem(key);
    return v!==null ? {key,value:v} : null;
  }catch(e){ return null; }
}
async function storageSet(key,value){
  if(window.storage && typeof window.storage.set==='function'){
    try{ return await window.storage.set(key,value); }catch(e){ return null; }
  }
  try{
    localStorage.setItem(key,value);
    return {key,value};
  }catch(e){ return null; }
}

async function loadAll(){
  try{
    const r = await storageGet('store-meta');
    if(r) DB.meta = JSON.parse(r.value);
  }catch(e){}
  try{
    const r = await storageGet('categories');
    if(r) DB.categories = JSON.parse(r.value);
  }catch(e){}
  try{
    const r = await storageGet('products');
    if(r) DB.products = JSON.parse(r.value);
  }catch(e){}
  await migrate();
  try{
    const r = await storageGet('customers');
    if(r) DB.customers = JSON.parse(r.value);
  }catch(e){}
  try{
    const r = await storageGet('shipments');
    if(r) DB.shipments = JSON.parse(r.value);
  }catch(e){}
  document.getElementById('storeName').textContent = DB.meta.name || 'متجري';
  render();
}
/* migration: old versions used fixed category names + one price pair */
async function migrate(){
  let changed=false, prodChanged=false;
  if(!DB.categories || DB.categories.length===0){
    const names = [...new Set(DB.products.map(p=>p.category).filter(Boolean))];
    const base = names.length?names:['رجالي','حريمي','عناية بالبشرة'];
    DB.categories = base.map(n=>({id:uid(),name:n,types:[]}));
    changed=true;
  }
  DB.products.forEach(p=>{
    const byId = DB.categories.find(c=>c.id===p.category);
    if(!byId){
      let c = DB.categories.find(c=>c.name===p.category);
      if(!c){ c={id:uid(),name:p.category||'عام',types:[]}; DB.categories.push(c); changed=true; }
      p.category=c.id; prodChanged=true;
    }
    const c = DB.categories.find(c=>c.id===p.category);
    const t = p.type||'عام';
    if(c && !c.types.includes(t)){ c.types.push(t); changed=true; }
    if(p.cost===undefined){ p.cost=Number(p.wholesale||0); prodChanged=true; }
    if(p.stock===undefined){ p.stock=0; prodChanged=true; }
  });
  DB.shipments.forEach(s=>{ (s.items||[]).forEach(it=>{ if(!it.mode) it.mode='retail'; }); });
  if(changed) await save('categories');
  if(prodChanged) await save('products');
}
async function save(key){
  try{
    if(key==='meta') await storageSet('store-meta', JSON.stringify(DB.meta));
    if(key==='categories') await storageSet('categories', JSON.stringify(DB.categories));
    if(key==='products') await storageSet('products', JSON.stringify(DB.products));
    if(key==='customers') await storageSet('customers', JSON.stringify(DB.customers));
    if(key==='shipments') await storageSet('shipments', JSON.stringify(DB.shipments));
  }catch(e){ toast('حصل خطأ في الحفظ'); console.error(e); }
}

/* ---------------- shipment profit calc ---------------- */
function shipCost(s){ return Number(s.total_cost!==undefined?s.total_cost:(s.total_wholesale||0))||0; }
function shipmentProfit(s){
  if(s.status==='confiscated') return -shipCost(s);
  const base = Number(s.price||0) - shipCost(s) - Number(s.shipping||0) - Number(s.tax||0) - Number(s.returns_amount||0);
  return base;
}
function totalProfit(){
  return DB.shipments.reduce((a,s)=>a+shipmentProfit(s),0);
}

/* ---- export / import backup ---- */
function exportBackup(){
  const data = {
    meta: DB.meta,
    categories: DB.categories,
    products: DB.products,
    customers: DB.customers,
    shipments: DB.shipments,
    exported_at: new Date().toISOString()
  };
  const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `daftary-backup-${todayStr()}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
  toast('اتحمّلت النسخة الاحتياطية');
}
function handleImportFile(ev){
  const file = ev.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const data = JSON.parse(e.target.result);
      if(!data || typeof data!=='object') throw new Error('bad');
      confirmImport(data);
    }catch(err){
      toast('الملف مش صالح، اتأكد إنه ملف نسخة احتياطية صحيح');
    }
  };
  reader.readAsText(file);
  ev.target.value = '';
}
function confirmImport(data){
  window._importData = data;
  const pCount = (data.products||[]).length;
  const cCount = (data.customers||[]).length;
  const sCount = (data.shipments||[]).length;
  showSheet(`
    <h3>استيراد نسخة احتياطية</h3>
    <div class="empty" style="margin-bottom:14px;">
      الملف فيه ${pCount} منتج، ${cCount} عميل، ${sCount} شحنة.<br>
      هيتم استبدال كل بياناتك الحالية بالكامل بالبيانات دي. متأكد؟
    </div>
    <button class="btn danger" onclick="applyImport()">تأكيد الاستبدال</button>
    <button class="btn ghost" onclick="openSettings()">إلغاء</button>
  `);
}
async function applyImport(){
  const data = window._importData;
  if(!data) return;
  DB.meta = data.meta || DB.meta;
  DB.categories = data.categories || [];
  DB.products = data.products || [];
  DB.customers = data.customers || [];
  DB.shipments = data.shipments || [];
  await save('meta');
  await save('categories');
  await save('products');
  await save('customers');
  await save('shipments');
  await migrate();
  document.getElementById('storeName').textContent = DB.meta.name || 'متجري';
  closeSheet();
  render();
  toast('تم استيراد البيانات بنجاح');
}

/* ---------------- PROFITS (monthly + log) ---------------- */
let profitMonthOpen = null;
function monthKey(d){ return (d||todayStr()).slice(0,7); }
function monthName(k){
  const [y,m] = k.split('-');
  return new Date(Number(y),Number(m)-1,1).toLocaleDateString('ar-EG',{month:'long',year:'numeric'});
}
function monthsMap(){
  const map = {};
  DB.shipments.forEach(s=>{
    const k = monthKey(s.order_date);
    if(!map[k]) map[k] = {profit:0,sales:0,cost:0,count:0,wholesale:0,retail:0,list:[]};
    const m = map[k];
    m.profit += shipmentProfit(s);
    m.sales  += Number(s.price||0);
    m.cost   += shipCost(s);
    m.count  += 1;
    m.wholesale += Number(s.sale_wholesale||0);
    m.retail    += Number(s.sale_retail||0);
    m.list.push(s);
  });
  return map;
}
function renderProfits(){
  const main = document.getElementById('mainArea');
  const map = monthsMap();
  const keys = Object.keys(map).sort().reverse();
  const total = totalProfit();

  if(profitMonthOpen && map[profitMonthOpen]){
    const m = map[profitMonthOpen];
    const list = [...m.list].sort((a,b)=>(b.order_date||'').localeCompare(a.order_date||''));
    main.innerHTML = `
      <div class="section-title">
        <h2 style="cursor:pointer" onclick="profitMonthOpen=null;render();">‹ ${monthName(profitMonthOpen)}</h2>
        <span class="muted">${m.count} شحنة</span>

        <div class="amount">${money(m.profit)}</div>
      </div>

        <div class="irow"><span>إجمالي المبيعات</span><b>${money(m.sales)}</b></div>
        <div class="irow"><span>منها بيع جملة</span><b>${money(m.wholesale)}</b></div>
        <div class="irow"><span>منها بيع قطاعي</span><b>${money(m.retail)}</b></div>
        <div class="irow"><span>تكلفة الشراء</span><b>${money(m.cost)}</b></div>
      </div>
      <div class="section-title"><h2>سجل الشهر</h2></div>
      ${list.map(s=>{
        const pr = shipmentProfit(s);
        return `<div class="ship-row" onclick="openShipmentForm('${s.id}')">
          <div class="row1">
            <span class="sp">${money(s.price)}</span>
            <span class="badge ${s.status}">${statusLabel(s.status)}</span>
          </div>
          <div class="meta">
            <span>🗓️ ${fmtDate(s.order_date)}</span>
            <span>📦 ${s.product_count||0} منتج</span>
          </div>
          <div class="profit-line" style="color:${pr>=0?'var(--primary)':'var(--danger)'}">صافي الربح: ${money(pr)}</div>
        </div>`;
      }).join('')}
    `;
    return;
  }

  main.innerHTML = `
    <div class="hero">
      <div class="eyebrow">صافي أرباحك من البداية</div>
      <div class="amount">${money(total)}</div>
    </div>
    <div class="section-title"><h2>الأرباح شهر بشهر</h2><span class="muted">${keys.length} شهر</span></div>
    ${keys.length===0 ? `<div class="empty">لسه مفيش أرباح مسجلة</div>` :
      keys.map(k=>{
        const m = map[k];
        return `<div class="cat-card" onclick="profitMonthOpen='${k}';render();">
          <div>
            <div class="cname">${monthName(k)}</div>
            <div class="csub">${m.count} شحنة · مبيعات ${money(m.sales)}</div>
          </div>

            <div class="csub">صافي الربح</div>
          </div>

    }
  `;
}

function refreshTypeOptions(){

    : `<select id="p_type">${types.map(t=>`<option ${t===cur?'selected':''}>${escapeHtml(t)}</option>`).join('')}<option value="__new">+ نوع جديد...</option></select>
       <input id="p_type_new" placeholder="اسم النوع الجديد" style="margin-top:8px;display:none">`;
  const sel = document.getElementById('p_type');
  if(sel && sel.tagName==='SELECT'){
    sel.onchange = ()=>{ document.getElementById('p_type_new').style.display = sel.value==='__new'?'block':'none'; };
  }

function handleImgPick(ev){
  const file = ev.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    const img = new Image();
    img.onload = function(){
      const max=320;
      let w=img.width, h=img.height;
      if(w>h && w>max){ h=h*(max/w); w=max; } else if(h>max){ w=w*(max/h); h=max; }
      const canvas=document.createElement('canvas');
      canvas.width=w; canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      const dataUrl = canvas.toDataURL('image/jpeg',0.75);
      window._tempImage = dataUrl;
      document.getElementById('imgPrev').innerHTML = `<img src="${dataUrl}">`;
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}
async function saveProduct(id){
  const name = document.getElementById('p_name').value.trim();
  if(!name){ toast('اكتب اسم المنتج'); return; }
  const cat = document.getElementById('p_cat').value;
  let type = document.getElementById('p_type').value.trim();
  if(type==='__new') type = (document.getElementById('p_type_new').value||'').trim();
  if(!type){ toast('اختار أو اكتب النوع'); return; }
  const c = catById(cat);
  if(c && !c.types.includes(type)){ c.types.push(type); await saveCats(); }
  const cost = Number(document.getElementById('p_cost').value)||0;
  const stock = Number(document.getElementById('p_stock').value)||0;
  const wholesale = Number(document.getElementById('p_wholesale').value)||0;
  const retail = Number(document.getElementById('p_retail').value)||0;
  const image = window._tempImage || null;
  if(id){
    Object.assign(DB.products.find(x=>x.id===id),{name,category:cat,type,cost,stock,wholesale,retail,image});
  }else{
    DB.products.push({id:uid(),name,category:cat,type,cost,stock,wholesale,retail,image});
  }
  await save('products'); closeSheet(); render(); toast('تم الحفظ');
}
async function deleteProduct(id){
  DB.products = DB.products.filter(p=>p.id!==id);
  await save('products'); closeSheet(); render(); toast('تم الحذف');
}

function statusLabel(s){
  if(s==='confirmed') return 'اتأكد وصولها';
  if(s==='confiscated') return 'اتصادرت';
  return 'في الطريق';
}
function unitPrice(p,mode){ return Number(mode==='wholesale'? p.wholesale : p.retail)||0; }
function applyStock(items,sign){
  (items||[]).forEach(it=>{
    const p = DB.products.find(x=>x.id===it.product_id);
    if(p) p.stock = Number(p.stock||0) + sign*Number(it.qty||0);
  });
}
function renderShipments(){
  const main = document.getElementById('mainArea');
  const sorted = [...DB.shipments].sort((a,b)=> (b.order_date||'').localeCompare(a.order_date||''));

          </div>

            <span>📦 ${s.product_count||0} منتج</span>
            <span>💰 تكلفة ${money(shipCost(s))}</span>

        </div>`;
      }).join('')
    }

}
let _shipDraft = null;
let _shipEditId = null;
let _pickerSearch = '';
let _returnSel = {};

function draftTotals(){
  let totalCost=0, totalSale=0, count=0, wSale=0, rSale=0;
  (_shipDraft.items||[]).forEach(it=>{
    const p = DB.products.find(x=>x.id===it.product_id);
    if(!p) return;
    const line = unitPrice(p,it.mode)*it.qty;
    totalCost += Number(p.cost||0)*it.qty;
    totalSale += line;
    if(it.mode==='wholesale') wSale += line; else rSale += line;
    count += it.qty;
  });
  return {totalCost,totalSale,count,wSale,rSale};
}
function origQty(pid){
  if(!_shipEditId) return 0;
  const s = DB.shipments.find(x=>x.id===_shipEditId);
  const it = (s.items||[]).find(i=>i.product_id===pid);
  return it?Number(it.qty||0):0;
}

function openShipmentForm(id){
  const s = id ? DB.shipments.find(x=>x.id===id) : null;
  _shipEditId = id||null;
  _shipDraft = s ? JSON.parse(JSON.stringify(s)) : {
    items:[], shipping:'', tax:'', order_date:todayStr(), delivery_days:'', returns:[], returns_amount:0, status:'pending'
  };
  if(!_shipDraft.items) _shipDraft.items = [];
  _shipDraft.items.forEach(it=>{ if(!it.mode) it.mode='retail'; });
  if(!_shipDraft.returns) _shipDraft.returns = [];
  renderShipmentSheet();
}

    ${ (s.returns&&s.returns.length>0) ? `

      </div>
    `:''}
    <button class="btn primary" onclick="saveShipment()">حفظ الشحنة</button>
    ${_shipEditId?`<button class="btn danger" onclick="deleteShipment('${_shipEditId}')">حذف الشحنة</button>`:''}

function setDraftStatus(status){
  _shipDraft.status = status;
  renderShipmentSheet();
}
async function saveShipment(){
  if(_shipDraft.items.length===0){ toast('اختار منتجات الشحنة الأول'); return; }
  const t = draftTotals();
  const payload = {
    items: _shipDraft.items,
    product_count: t.count,
    total_cost: t.totalCost,
    total_wholesale: t.totalCost,
    sale_wholesale: t.wSale,
    sale_retail: t.rSale,
    price: t.totalSale,
    shipping: Number(_shipDraft.shipping)||0,
    tax: Number(_shipDraft.tax)||0,
    order_date: _shipDraft.order_date || todayStr(),
    delivery_days: Number(_shipDraft.delivery_days)||0,
    returns: _shipDraft.returns || [],
    returns_amount: Number(_shipDraft.returns_amount)||0,
    status: _shipDraft.status || 'pending'
  };
  if(_shipEditId){
    const s = DB.shipments.find(x=>x.id===_shipEditId);
    applyStock(s.items, +1);
    applyStock(payload.items, -1);
    Object.assign(s,payload);
  }else{
    applyStock(payload.items, -1);
    DB.shipments.push({id:uid(),...payload});
  }
  await save('products');
  await save('shipments');
  closeSheet(); render(); toast('تم الحفظ والكمية اتخصمت من المخزن');
}
async function deleteShipment(id){
  const s = DB.shipments.find(x=>x.id===id);
  if(s){
    applyStock(s.items, +1);
    (s.returns||[]).forEach(r=>applyStock(r.items,-1));
  }
  DB.shipments = DB.shipments.filter(x=>x.id!==id);
  await save('products');
  await save('shipments');
  closeSheet(); render(); toast('تم الحذف');
}

/* ---- returns ---- */
function alreadyReturnedQty(s, productId){
  return (s.returns||[]).reduce((sum,r)=> sum + r.items.filter(it=>it.product_id===productId).reduce((a,it)=>a+it.qty,0), 0);
}
function openReturnPicker(){
  if(!_shipEditId){ toast('احفظ الشحنة الأول'); return; }
  _returnSel = {};
  renderReturnPicker();
}
function renderReturnPicker(){
  const s = DB.shipments.find(x=>x.id===_shipEditId);
  showSheet(`
    <h3>تسجيل مرتجع</h3>
    ${ (!s.items||s.items.length===0) ? `<div class="empty">مفيش منتجات في الشحنة دي</div>` :
      s.items.map(it=>{
        const p = DB.products.find(x=>x.id===it.product_id);
        if(!p) return '';
        const already = alreadyReturnedQty(s,it.product_id);
        const remaining = it.qty - already;
        const sel = _returnSel[it.product_id]||0;
        if(remaining<=0) return `
          <div class="pick-row" style="opacity:.5">
            <div class="pimg">${p.image?`<img src="${p.image}">`:noImgSvg()}</div>
            <div class="pinfo"><div class="pn">${escapeHtml(p.name)}</div><div class="pw">كل الكمية رجعت بالفعل</div></div>
          </div>`;
        return `
        <div class="pick-row">
          <div class="pimg">${p.image?`<img src="${p.image}">`:noImgSvg()}</div>
          <div class="pinfo">
            <div class="pn">${escapeHtml(p.name)}</div>
            <div class="pw">متاح للإرجاع ${remaining} من ${it.qty}</div>
          </div>
          <div class="qty-box">
            <button onclick="changeReturnQty('${it.product_id}',-1,${remaining})">−</button>
            <span class="qn">${sel}</span>
            <button onclick="changeReturnQty('${it.product_id}',1,${remaining})">+</button>
          </div>
        </div>`;
      }).join('')
    }
    <button class="btn primary" onclick="confirmReturn()">تسجيل المرتجع</button>
    <button class="btn ghost" onclick="renderShipmentSheet()">رجوع</button>
  `);
}
function changeReturnQty(productId, delta, max){
  const cur = _returnSel[productId]||0;
  let next = cur+delta;
  if(next<0) next=0;
  if(next>max) next=max;
  _returnSel[productId]=next;
  renderReturnPicker();
}
async function confirmReturn(){
  const s = DB.shipments.find(x=>x.id===_shipEditId);
  const items = Object.entries(_returnSel).filter(([pid,qty])=>qty>0).map(([pid,qty])=>({product_id:pid, qty}));
  if(items.length===0){ toast('اختار كمية الإرجاع'); return; }
  const amount = items.reduce((a,it)=>{
    const p = DB.products.find(x=>x.id===it.product_id);
    const line = (s.items||[]).find(i=>i.product_id===it.product_id);
    return a + (p? unitPrice(p, line?line.mode:'retail')*it.qty : 0);
  },0);
  if(!s.returns) s.returns=[];
  s.returns.push({id:uid(), date:todayStr(), items, amount});
  s.returns_amount = s.returns.reduce((a,r)=>a+r.amount,0);
  applyStock(items, +1);
  await save('products');
  await save('shipments');
  toast('اتسجل المرتجع والكمية رجعت للمخزن');
  _shipDraft = JSON.parse(JSON.stringify(s));
  renderShipmentSheet();
  render();
}
async function deleteReturn(returnId){
  const s = DB.shipments.find(x=>x.id===_shipEditId);
  const r = (s.returns||[]).find(x=>x.id===returnId);
  if(r) applyStock(r.items,-1);
  s.returns = (s.returns||[]).filter(x=>x.id!==returnId);
  s.returns_amount = s.returns.reduce((a,x)=>a+x.amount,0);
  await save('products');
  await save('shipments');
  _shipDraft = JSON.parse(JSON.stringify(s));
  renderShipmentSheet();
  render();
  toast('اتحذف المرتجع');
}

/* ---- product picker inside shipment ---- */
function openProductPicker(){
  _pickerSearch = '';
  renderProductPicker();
}
function renderProductPicker(){
  const q = _pickerSearch.trim();
  const list = DB.products.filter(p=>{
    if(!q) return true;
    const c = catById(p.category);
    return p.name.includes(q) || (p.type||'').includes(q) || (c&&c.name.includes(q));
  });
  showSheet(`
    <h3>اختيار منتجات</h3>
    <input class="picker-search" placeholder="ابحث عن منتج..." value="${escapeHtml(q)}" oninput="_pickerSearch=this.value;renderProductPicker();">
    ${ list.length===0 ? `<div class="empty">مفيش منتجات مطابقة${DB.products.length===0?' - ضيف منتجات الأول من قسم المنتجات':''}</div>` :
      list.map(p=>{
        const existing = _shipDraft.items.find(it=>it.product_id===p.id);
        const qty = existing?existing.qty:0;
        const mode = existing?existing.mode:'retail';
        const avail = Number(p.stock||0) + origQty(p.id) - qty;
        return `
        <div class="pick-row" style="flex-wrap:wrap">
          <div class="pimg">${p.image?`<img src="${p.image}">`:noImgSvg()}</div>
          <div class="pinfo">
            <div class="pn">${escapeHtml(p.name)}</div>
            <div class="pw">جملة ${money(p.wholesale)} · قطاعي ${money(p.retail)}</div>
            <div class="pw" style="color:${avail>0?'var(--primary)':'var(--danger)'}">متاح ${avail} قطعة</div>
          </div>
          <div class="qty-box">
            <button onclick="changeQty('${p.id}',-1)">−</button>
            <span class="qn">${qty}</span>
            <button onclick="changeQty('${p.id}',1)">+</button>
          </div>
          ${qty>0?`
          <div class="mode-row">
            <button class="${mode==='wholesale'?'on':''}" onclick="setItemMode('${p.id}','wholesale')">بيع جملة</button>
            <button class="${mode==='retail'?'on':''}" onclick="setItemMode('${p.id}','retail')">بيع قطاعي</button>
          </div>`:''}
        </div>`;
      }).join('')
    }
    <button class="btn primary" onclick="renderShipmentSheet()">تم الاختيار</button>
  `);
}
function setItemMode(productId, mode){
  const it = _shipDraft.items.find(x=>x.product_id===productId);
  if(it){ it.mode = mode; renderProductPicker(); }
}
function changeQty(productId, delta){
  const items = _shipDraft.items;
  const p = DB.products.find(x=>x.id===productId);
  let it = items.find(x=>x.product_id===productId);
  const cur = it?it.qty:0;
  const maxQty = Number(p.stock||0) + origQty(productId);
  if(delta>0 && cur+1>maxQty){ toast('الكمية المتاحة في المخزن خلصت'); return; }
  if(!it){
    if(delta>0){ items.push({product_id:productId, qty:1, mode:'retail'}); }
  }else{
    it.qty += delta;
    if(it.qty<=0){ _shipDraft.items = items.filter(x=>x.product_id!==productId); }
  }
  renderProductPicker();
}

/* ---------------- sheet helpers ---------------- */
function showSheet(html){
  const root = document.getElementById('modalRoot');
  root.innerHTML = `<div class="overlay" onclick="if(event.target===this)closeSheet()"><div class="sheet">${html}</div></div>`;
}
function closeSheet(){ document.getElementById('modalRoot').innerHTML=''; }
function escapeHtml(s){
  return (s||'').toString().replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

document.getElementById('bgLayer').style.backgroundImage = `url("${HERO_IMG}")`;
loadAll();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('service-worker.js').catch(()=>{});
  });
}
